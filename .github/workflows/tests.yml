name: Tests

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: cppcheck
        run: |
          set -o pipefail
          cppcheck --enable=warning,performance,portability --std=c11 --inline-suppr \
            --suppress=missingIncludeSystem --error-exitcode=1 -I src --quiet src/ \
            2>&1 | tee cppcheck-report.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: cppcheck-report
          path: cppcheck-report.txt

  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DUNDERTHEC_STATIC=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - run: cmake --build build -j
      - name: smoke run under asan/ubsan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          for args in "" "-c" "-m hi"; do
            echo "=== underthec $args ==="
            script -qec "timeout --preserve-status -s TERM 5 build/underthec $args" /dev/null
          done
